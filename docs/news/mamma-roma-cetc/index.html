      <h1 class="pd-title pd-title--page" data-fr="Mamma Roma en création au Teatro Colón" data-es="Mamma Roma en creación en el Teatro Colón" data-en="Mamma Roma premieres at the Teatro Colón" data-zh="Mamma Roma 于科隆剧院首演"></h1>
      <figure class="pd-media"><img src="../../assets/projects/mamma-roma.jpg" alt="Mamma Roma en création au Teatro Colón" /></figure>
      <p class="pd-pitch" data-fr="Mamma Roma, opéra d'après Pasolini mis en scène par Martin Bauer, est créé au CETC — Teatro Colón (Buenos Aires) en 2027." data-es="Mamma Roma, ópera a partir de Pasolini dirigida por Martin Bauer, se estrena en el CETC — Teatro Colón (Buenos Aires) en 2027." data-en="Mamma Roma, an opera after Pasolini staged by Martin Bauer, premieres at the CETC — Teatro Colón (Buenos Aires) in 2027." data-zh="取材自帕索里尼、Martin Bauer 执导的歌剧 Mamma Roma，于 2027 年在 CETC — 科隆剧院（布宜诺斯艾利斯）首演。"></p>
      <div class="prose"><p data-fr="Autour d'une table qui devient tombeau, Mamma Roma poursuit le dialogue de STOPERA! avec la scène lyrique argentine. Création au Centro de Experimentación del Teatro Colón (CETC), qui en assure la production." data-es="En torno a una mesa que se vuelve tumba, Mamma Roma prolonga el diálogo de STOPERA! con la escena lírica argentina. Estreno en el Centro de Experimentación del Teatro Colón (CETC), que asegura su producción." data-en="Around a table that becomes a tomb, Mamma Roma continues STOPERA!'s dialogue with the Argentine opera scene. Premiered at the Centro de Experimentación del Teatro Colón (CETC), which produces it." data-zh="围绕一张化为坟墓的餐桌，Mamma Roma 延续 STOPERA! 与阿根廷歌剧场景的对话。于科隆剧院实验中心（CETC）首演并由其制作。"></p></div>
