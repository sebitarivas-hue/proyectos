      <h1 class="pd-title pd-title--page" data-fr="STOPERA! accompagne « We Expected the Disaster… »" data-es="STOPERA! acompaña « We Expected the Disaster… »" data-en="STOPERA! supports “We Expected the Disaster…”" data-zh="STOPERA! 陪伴《We Expected the Disaster…》"></h1>
      <figure class="pd-media"><img src="../../assets/projects/salamandres.jpg" alt="STOPERA! accompagne « We Expected the Disaster… »" /></figure>
      <p class="pd-pitch" data-fr="STOPERA! entre en accompagnement de l'opéra politique et écologique de - porte renaud - (Cie Trilobite), en amont de sa création au festival Tête à Tête (Londres) en 2027." data-es="STOPERA! acompaña la ópera política y ecológica de - porte renaud - (Cie Trilobite), antes de su estreno en el festival Tête à Tête (Londres) en 2027." data-en="STOPERA! begins supporting - porte renaud -'s political, ecological opera (Cie Trilobite), ahead of its premiere at the Tête à Tête festival (London) in 2027." data-zh="STOPERA! 开始陪伴 - porte renaud -（Cie Trilobite）的政治与生态歌剧，先于其 2027 年在伦敦 Tête à Tête 音乐节首演。"></p>
      <div class="prose"><p data-fr="D'après La Guerre des salamandres de Karel Čapek, We Expected the Disaster… but not the salamanders! mêle extractivisme, crise écologique et un fort travail avec les populations (recherche-action, éducation populaire). STOPERA! en accompagne une première phase de développement — structuration, communication et mise en réseau — vers une diffusion en France, en Europe et en Amérique latine." data-es="A partir de La guerra de las salamandras de Karel Čapek, We Expected the Disaster… but not the salamanders! entrelaza extractivismo, crisis ecológica y un fuerte trabajo con las poblaciones (investigación-acción, educación popular). STOPERA! acompaña una primera fase de desarrollo — estructuración, comunicación y puesta en red — hacia una difusión en Francia, Europa y América Latina." data-en="After Karel Čapek's War with the Newts, We Expected the Disaster… but not the salamanders! weaves together extractivism, ecological crisis and a strong practice of work with communities (action-research, popular education). STOPERA! supports a first development phase — structuring, communication and networking — towards diffusion in France, Europe and Latin America." data-zh="取材自卡雷尔·恰佩克《鲵鱼之乱》，《We Expected the Disaster… but not the salamanders!》交织攫取主义、生态危机与深入的民众工作（行动研究、平民教育）。STOPERA! 陪伴其首个发展阶段——结构搭建、传播与人脉——推动其在法国、欧洲与拉丁美洲的巡演。"></p></div>
