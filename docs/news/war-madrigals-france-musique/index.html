      <h1 class="pd-title pd-title--page" data-fr="War Madrigals : première étape sur France Musique" data-es="War Madrigals: primera etapa en France Musique" data-en="War Madrigals: first step on France Musique" data-zh="War Madrigals：France Musique 首个阶段"></h1>
      <figure class="pd-media"><img src="../../assets/projects/war-madrigals.jpg" alt="War Madrigals : première étape sur France Musique" /></figure>
      <p class="pd-pitch" data-fr="Cycle de dix madrigaux pour six voix, War Madrigals entre en création avec Les Métaboles (direction Léo Warynski) dans « Création Mondiale » sur France Musique." data-es="Ciclo de diez madrigales para seis voces, War Madrigals entra en creación con Les Métaboles (dirección Léo Warynski) en «Création Mondiale» de France Musique." data-en="A cycle of ten madrigals for six voices, War Madrigals enters creation with Les Métaboles (conducted by Léo Warynski) in France Musique's “Création Mondiale.”" data-zh="为六声部创作的十首牧歌套曲 War Madrigals，与 Les Métaboles（Léo Warynski 指挥）在 France Musique「Création Mondiale」中进入创作。"></p>
      <div class="prose"><p data-fr="Première étape de création dans l'émission « Création Mondiale » d'Anne Montaron (France Musique), War Madrigals explore la guerre, la mémoire et l'effritement du langage à travers un cycle polyphonique multilingue. Distribution et dates en cours de finalisation." data-es="Primera etapa de creación en el programa «Création Mondiale» de Anne Montaron (France Musique), War Madrigals explora la guerra, la memoria y la erosión del lenguaje mediante un ciclo polifónico multilingüe. Reparto y fechas en proceso de confirmación." data-en="A first creation step in Anne Montaron's “Création Mondiale” programme (France Musique), War Madrigals explores war, memory and the erosion of language through a multilingual polyphonic cycle. Cast and dates being finalised." data-zh="作为 Anne Montaron 主持的「Création Mondiale」节目（France Musique）的首个创作阶段，War Madrigals 透过多语复调套曲探索战争、记忆与语言的崩解。演员与日期确认中。"></p></div>
