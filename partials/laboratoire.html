<section id="recherche" class="section">
      <div class="grid-2">
        <div class="col-label"><span class="index"></span><span class="eyebrow" data-fr="Recherche & LIPS" data-es="Investigación & LIPS" data-en="Research & LIPS" data-zh="研究 & LIPS"></span></div>
        <div class="col-body">
          <h2 class="lead" data-fr="La recherche, au cœur du plateau." data-es="La investigación, en el corazón de la escena." data-en="Research, at the heart of the stage." data-zh="研究，处于舞台的核心。"></h2>
          <div class="prose">
            <p data-fr="Chez STOPERA!, la recherche se fait en pratique : sur le plateau, avec des interprètes, autour de la voix, du corps, de l'écoute et de la présence. Elle prend la forme d'un laboratoire — un temps d'expérimentation, de co-écriture et de rencontre entre les disciplines."
               data-es="En STOPERA!, la investigación se hace en la práctica: en escena, con intérpretes, en torno a la voz, el cuerpo, la escucha y la presencia. Toma la forma de un laboratorio: un tiempo de experimentación, de co-escritura y de encuentro entre disciplinas."
               data-en="At STOPERA!, research happens in practice: on stage, with performers, around voice, body, listening and presence. It takes the form of a laboratory — a time for experimentation, co-writing and encounter between disciplines."
               data-zh="在 STOPERA!，研究在实践中发生：在舞台上、与表演者一起，围绕人声、身体、聆听与在场。它以工作坊的形式展开——一段实验、共同书写与跨学科相遇的时光。"></p>
            <p data-fr="La transmission prolonge cette recherche : STOPERA! accompagne les jeunes artistes, partage ses pratiques et tisse des liens avec des interprètes, des universités et des lieux partenaires, en France et à l'international. Son laboratoire international, <strong>LIPS</strong>, en est le cœur."
               data-es="La transmisión prolonga esta investigación: STOPERA! acompaña a los jóvenes artistas, comparte sus prácticas y teje vínculos con intérpretes, universidades y espacios asociados, en Francia y en el ámbito internacional. Su laboratorio internacional, <strong>LIPS</strong>, es su corazón."
               data-en="Transmission extends this research: STOPERA! mentors young artists, shares its practices and builds ties with performers, universities and partner venues, in France and internationally. Its international laboratory, <strong>LIPS</strong>, is its heart."
               data-zh="传承延续了这项研究：STOPERA! 陪伴青年艺术家，分享其实践，并与表演者、高校及合作场馆建立联系，遍及法国与国际。其国际工作坊 <strong>LIPS</strong> 正是核心。"></p>
          </div>

    <section id="lips" class="section">
      <div class="grid-2">
        <div class="col-label"><span class="index"></span><span class="eyebrow">LIPS</span></div>
        <div class="col-body">
          <h2 class="lead" data-fr="Un laboratoire international de pratiques scéniques." data-es="Un laboratorio internacional de prácticas escénicas." data-en="An international laboratory of stage practices." data-zh="一个国际舞台实践工作坊。"></h2>
          <div class="prose">
            <p data-fr="LIPS — <em>Laboratoire In(ter)discipliné de Prototypes Scéniques</em> — réunit à chaque édition huit à dix artistes émergents de toutes disciplines : composition, mise en scène, arts visuels, théâtre, danse. Créé en 2019, il leur ouvre studios, outils et équipes de recherche au fil de trois sessions de travail, accompagnées par des artistes confirmés."
               data-es="LIPS —<em>Laboratoire In(ter)discipliné de Prototypes Scéniques</em>— reúne en cada edición de ocho a diez artistas emergentes de todas las disciplinas: composición, dirección de escena, artes visuales, teatro, danza. Creado en 2019, les abre estudios, herramientas y equipos de investigación a lo largo de tres sesiones de trabajo, acompañadas por artistas consagrados."
               data-en="LIPS — <em>Laboratoire In(ter)discipliné de Prototypes Scéniques</em> — brings together eight to ten emerging artists from all disciplines at each edition: composition, stage direction, visual arts, theatre, dance. Created in 2019, it opens its studios, tools and research teams across three working sessions, mentored by established artists."
               data-zh="LIPS——<em>Laboratoire In(ter)discipliné de Prototypes Scéniques</em>——每届汇集八至十位来自各学科（作曲、导演、视觉艺术、戏剧、舞蹈）的新锐艺术家。创立于 2019 年，通过三段工作期向他们开放工作室、工具与研究团队，并由资深艺术家陪伴。"></p>
            <p data-fr="Un espace d'échange, d'expérimentation et de co-écriture, où la transmission se fait par la pratique. Les outils numériques y sont une matière commune, jamais une fin."
               data-es="Un espacio de intercambio, experimentación y co-escritura, donde la transmisión se hace por la práctica. Las herramientas digitales son una materia común, nunca un fin."
               data-en="A space for exchange, experimentation and co-writing, where transmission happens through practice. Digital tools are common material, never an end."
               data-zh="一个交流、实验与共同书写的空间，让传承通过实践发生。数字工具是共享的素材，而非目的。"></p>
          </div>
