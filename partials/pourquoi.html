    <section id="apropos" class="section">
      <div class="grid-2">
        <div class="col-label"><span class="index"></span><span class="eyebrow" data-fr="Pourquoi STOPERA!" data-es="Por qué STOPERA!" data-en="Why STOPERA!" data-zh="为何 STOPERA!"></span></div>
        <div class="col-body">
          <h2 class="lead" data-fr="Les formes scéniques traversent aujourd'hui une profonde transformation." data-es="Las formas escénicas atraviesan hoy una profunda transformación." data-en="The performing arts are undergoing a profound transformation." data-zh="舞台形式正经历一场深刻的转变。"></h2>
          <div class="prose">
            <p data-fr="Les frontières entre musique, théâtre, image, technologies, recherche et performance s'effacent, au profit de nouvelles écritures qui réinterrogent notre manière de raconter le monde. C'est dans ce contexte qu'est née STOPERA!."
               data-es="Las fronteras entre música, teatro, imagen, tecnologías, investigación y performance se borran, en favor de nuevas escrituras que reinterrogan nuestra manera de contar el mundo. En este contexto nació STOPERA!."
               data-en="The boundaries between music, theatre, image, technology, research and performance are dissolving, giving way to new forms of writing that reshape how we tell the world. It is in this context that STOPERA! was born."
               data-zh="音乐、戏剧、影像、技术、研究与表演之间的边界正在消融，让位于重新叩问我们如何讲述世界的新书写。STOPERA! 正诞生于这一背景。"></p>
            <p class="manifesto-question"
               data-fr="STOPERA! rassemble artistes, chercheurs, institutions et publics autour d'une question commune : quelles formes scéniques pour le XXIe siècle ?"
               data-es="STOPERA! reúne a artistas, investigadores, instituciones y públicos en torno a una pregunta común: ¿qué formas escénicas para el siglo XXI?"
               data-en="STOPERA! brings together artists, researchers, institutions and audiences around a common question: what stage forms for the 21st century?"
               data-zh="STOPERA! 汇聚艺术家、研究者、机构与公众，围绕一个共同的问题：二十一世纪需要怎样的舞台形式？"></p>
            <p class="manifesto-claim"
               data-fr="STOPERA! n'est pas une compagnie, ni un collectif, ni un simple producteur : c'est une infrastructure légère de recherche et de création dédiée aux nouvelles écritures de la scène musicale contemporaine."
               data-es="STOPERA! no es una compañía, ni un colectivo, ni un simple productor: es una infraestructura ligera de investigación y creación dedicada a las nuevas escrituras de la escena musical contemporánea."
               data-en="STOPERA! is not a company, nor a collective, nor merely a producer: it is a light infrastructure for research and creation dedicated to the new forms of contemporary musical theatre."
               data-zh="STOPERA! 不是一家剧团，不是一个团体，也不只是制作方：它是一个轻量的研究与创作基础设施，致力于当代音乐舞台的新书写。"></p>
            <div class="name-note">
              <p class="name-mark" aria-hidden="true"><b>STOP</b> · OPERA</p>
              <p data-fr="Le nom dit la méthode. Le STOP de STOPERA n'est pas un refus de l'opéra : c'est une suspension — le temps d'arrêt d'où naît le geste, l'espace de recherche soustrait à la pression de la production."
                 data-es="El nombre dice el método. El STOP de STOPERA no es un rechazo de la ópera: es una suspensión — el tiempo de detención del que nace el gesto, el espacio de investigación sustraído a la presión de la producción."
                 data-en="The name states the method. The STOP in STOPERA is not a refusal of opera: it is a suspension — the pause from which the gesture is born, the space of research withdrawn from the pressure of production."
                 data-zh="名字道出方法。STOPERA 的 STOP 并非拒绝歌剧：它是一种悬停——动作由之而生的停顿，从生产压力中抽离出来的研究空间。"></p>
              <p data-fr="Ce temps porte un nom que les institutions reconnaissent : celui de la recherche et de l'expérimentation artistiques, que l'économie du spectacle — tendue vers la première — laisse rarement exister. STOPERA en fait sa raison d'être : le rendre possible, le structurer, le transmettre. On s'arrête pour chercher, puis on crée."
                 data-es="Ese tiempo tiene un nombre que las instituciones reconocen: el de la investigación y la experimentación artísticas, que la economía del espectáculo — tensa hacia el estreno — rara vez deja existir. STOPERA hace de ello su razón de ser: hacerlo posible, estructurarlo, transmitirlo. Nos detenemos para investigar, y luego creamos."
                 data-en="This time has a name that institutions recognise: that of artistic research and experimentation — the time that the economy of performance, strained towards opening night, rarely allows to exist. STOPERA makes it its purpose: to make it possible, to structure it, to pass it on. We stop to search, then we create."
                 data-zh="这段时间有一个机构所熟知的名字：艺术研究与实验——面向首演、绷紧的演出经济往往不容其存在。STOPERA 以此为宗旨：让它成为可能，加以建构，并予以传承。先停下来探索，再进行创作。"></p>
            </div>
            <p class="manifesto-vision"
               data-fr="Notre ambition : transformer la manière dont l'opéra et le théâtre musical se pensent, se fabriquent et se transmettent."
               data-es="Nuestra ambición: transformar la manera en que la ópera y el teatro musical se piensan, se fabrican y se transmiten."
               data-en="Our ambition: to transform the way opera and music theatre are conceived, made and passed on."
               data-zh="我们的抱负：转变歌剧与音乐剧场被构思、制作与传承的方式。"></p>
            <p data-fr="Ancrée à Gentilly et active en France comme à l'international, STOPERA! accompagne des artistes, développe des laboratoires de <strong>recherche artistique</strong>, produit des œuvres et construit des coopérations durables entre institutions, chercheurs, interprètes et publics."
               data-es="Con sede en Gentilly y activa en Francia y en el ámbito internacional, STOPERA! acompaña a artistas, desarrolla laboratorios de <strong>investigación artística</strong>, produce obras y construye cooperaciones duraderas entre instituciones, investigadores, intérpretes y públicos."
               data-en="Rooted in Gentilly and active in France and internationally, STOPERA! supports artists, develops <strong>artistic research</strong> laboratories, produces works and builds lasting cooperations between institutions, researchers, performers and audiences."
               data-zh="扎根让蒂伊、活跃于法国与国际，STOPERA! 陪伴艺术家，发展<strong>艺术研究</strong>实验室，制作作品，并在机构、研究者、表演者与公众之间建立持久的合作。"></p>
            <p data-fr="Plus qu'une compagnie, STOPERA! est un espace où les œuvres se développent sur le temps long, croisent les disciplines et expérimentent de nouveaux modes de création."
               data-es="Más que una compañía, STOPERA! es un espacio donde las obras se desarrollan en el tiempo largo, cruzan las disciplinas y experimentan nuevos modos de creación."
               data-en="More than a company, STOPERA! is a space where works develop over the long term, cross disciplines and experiment with new modes of creation."
               data-zh="STOPERA! 不止是一家剧团，而是一个让作品得以长期发展、跨越学科并试验新创作方式的空间。"></p>
            <p data-fr="Au cœur de cette démarche, une conviction : les grandes transformations de notre époque — technologiques, écologiques, sociales — appellent de nouvelles formes d'<strong>incarnation</strong>. La musique, la voix, le corps, le texte, l'espace, l'image et les technologies n'y sont pas des disciplines séparées, mais les composantes d'une même écriture vivante."
               data-es="En el corazón de este trabajo, una convicción: las grandes transformaciones de nuestra época — tecnológicas, ecológicas, sociales — exigen nuevas formas de <strong>encarnación</strong>. La música, la voz, el cuerpo, el texto, el espacio, la imagen y las tecnologías no son disciplinas separadas, sino los componentes de una misma escritura viva."
               data-en="At the heart of this approach, one conviction: the great transformations of our time — technological, ecological, social — call for new forms of <strong>embodiment</strong>. Music, voice, body, text, space, image and technology are not separate disciplines here, but components of a single living form of writing."
               data-zh="这一路径的核心是一个信念：我们时代的重大转变——技术的、生态的、社会的——呼唤新的<strong>化身</strong>形式。音乐、人声、身体、文本、空间、影像与技术在此并非彼此分离的学科，而是同一种鲜活书写的构成要素。"></p>
            <p data-fr="Autour de <a href='../artists/sebastian-rivas/'>Sebastian Rivas</a> se réunissent des artistes, interprètes, auteurs, chercheurs et producteurs — parmi lesquels <a href='../artists/olivia-martin/'>Olivia Martin</a>, <a href='../artists/nicola-beller-carbone/'>Nicola Beller Carbone</a>, <a href='../artists/martin-bauer/'>Martin Bauer</a> et <a href='../artists/anne-laure-chamboissier/'>Anne-Laure Chamboissier</a> — avec le compagnonnage artistique de <a href='../artists/georges-aperghis/'>Georges Aperghis</a>."
               data-es="En torno a <a href='../artists/sebastian-rivas/'>Sebastian Rivas</a> se reúnen artistas, intérpretes, autores, investigadores y productores — entre ellos <a href='../artists/olivia-martin/'>Olivia Martin</a>, <a href='../artists/nicola-beller-carbone/'>Nicola Beller Carbone</a>, <a href='../artists/martin-bauer/'>Martin Bauer</a> y <a href='../artists/anne-laure-chamboissier/'>Anne-Laure Chamboissier</a> — con el acompañamiento artístico de <a href='../artists/georges-aperghis/'>Georges Aperghis</a>."
               data-en="Around <a href='../artists/sebastian-rivas/'>Sebastian Rivas</a> gather artists, performers, authors, researchers and producers — among them <a href='../artists/olivia-martin/'>Olivia Martin</a>, <a href='../artists/nicola-beller-carbone/'>Nicola Beller Carbone</a>, <a href='../artists/martin-bauer/'>Martin Bauer</a> and <a href='../artists/anne-laure-chamboissier/'>Anne-Laure Chamboissier</a> — with the artistic companionship of <a href='../artists/georges-aperghis/'>Georges Aperghis</a>."
               data-zh="围绕 <a href='../artists/sebastian-rivas/'>Sebastian Rivas</a> 汇聚了艺术家、表演者、作者、研究者与制作人——其中包括 <a href='../artists/olivia-martin/'>Olivia Martin</a>、<a href='../artists/nicola-beller-carbone/'>Nicola Beller Carbone</a>、<a href='../artists/martin-bauer/'>Martin Bauer</a> 与 <a href='../artists/anne-laure-chamboissier/'>Anne-Laure Chamboissier</a>——并得到 <a href='../artists/georges-aperghis/'>Georges Aperghis</a> 的艺术陪伴。"></p>
            <p data-fr="À travers ses créations, ses laboratoires, ses résidences et ses actions de <strong>transmission</strong>, STOPERA! contribue au renouvellement des écritures scéniques contemporaines et à l'émergence d'un espace de recherche partagé entre création artistique, innovation et société."
               data-es="A través de sus creaciones, sus laboratorios, sus residencias y sus acciones de <strong>transmisión</strong>, STOPERA! contribuye a la renovación de las escrituras escénicas contemporáneas y a la emergencia de un espacio de investigación compartido entre creación artística, innovación y sociedad."
               data-en="Through its creations, laboratories, residencies and <strong>transmission</strong> work, STOPERA! contributes to renewing contemporary stage writing and to the emergence of a shared research space between artistic creation, innovation and society."
               data-zh="通过其创作、实验室、驻地与<strong>传承</strong>行动，STOPERA! 助力当代舞台书写的革新，并推动一个联结艺术创作、创新与社会的共享研究空间的生成。"></p>
          </div>
        </div>
      </div>
    </section>
